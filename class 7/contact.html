<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ubaid | Contact</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->
    <header>

        <nav>

            <h2 class="logo">
                UBAID<span>.</span>
            </h2>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                       class="active">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CONTACT -->
    <main class="page-container">

        <section class="contact-section">


            <!-- HEADING -->
            <div class="section-heading">

                <p class="small-title">
                    LET'S CONNECT
                </p>

                <h1>
                    Contact <span>Me</span>
                </h1>

                <p>
                    If you have a question, project idea or simply
                    want to connect, feel free to contact me.
                </p>

            </div>


            <div class="contact-container">


                <!-- CONTACT INFORMATION -->
                <div class="contact-info">


                    <div class="contact-item">

                        <div class="contact-icon">
                            @
                        </div>

                        <div>

                            <h3>
                                Email
                            </h3>

                            <p>
                                ubaid@example.com
                            </p>

                        </div>

                    </div>


                    <div class="contact-item">

                        <div class="contact-icon">
                            ☎
                        </div>

                        <div>

                            <h3>
                                Phone
                            </h3>

                            <p>
                                +92 300 1234567
                            </p>

                        </div>

                    </div>


                    <div class="contact-item">

                        <div class="contact-icon">
                            ●
                        </div>

                        <div>

                            <h3>
                                Location
                            </h3>

                            <p>
                                Pakistan
                            </p>

                        </div>

                    </div>


                </div>


                <!-- FORM -->
                <form class="contact-form">

                    <input
                        type="text"
                        placeholder="Your Name"
                        required
                    >

                    <input
                        type="email"
                        placeholder="Your Email"
                        required
                    >

                    <input
                        type="text"
                        placeholder="Subject"
                        required
                    >

                    <textarea
                        rows="6"
                        placeholder="Your Message"
                        required
                    ></textarea>

                    <button
                        type="submit"
                        class="btn">
                        SEND MESSAGE
                    </button>

                </form>


            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Ubaid. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
